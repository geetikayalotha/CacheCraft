<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="CacheCraft workshop banner">
  <title>CacheCraft: Semantic Cache Strategy Bench</title>
  <desc>An animated workshop banner: a copper anvil where request tokens are forged into cache keys against a slate backdrop.</desc>
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b333d"/>
      <stop offset="1" stop-color="#1a2027"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a26a"/>
      <stop offset="0.5" stop-color="#c8743b"/>
      <stop offset="1" stop-color="#8f4a24"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.6" stop-color="#e07b2e"/>
      <stop offset="1" stop-color="#e07b2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="720" height="240" fill="url(#slate)"/>

  <!-- slate rivet grid -->
  <g fill="#3a444f">
    <circle cx="24" cy="24" r="3"/><circle cx="696" cy="24" r="3"/>
    <circle cx="24" cy="216" r="3"/><circle cx="696" cy="216" r="3"/>
  </g>

  <!-- forge glow -->
  <ellipse cx="200" cy="150" rx="120" ry="46" fill="url(#ember)" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="112;128;112" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- anvil -->
  <g fill="url(#copper)" stroke="#5c3218" stroke-width="1.5">
    <path d="M120 168 h160 v14 h-20 l-8 18 h-104 l-8 -18 h-20 z"/>
    <rect x="150" y="146" width="100" height="24" rx="4"/>
    <path d="M250 146 h44 l-10 22 h-34 z"/>
  </g>

  <!-- token sparks rising into keys -->
  <g font-family="monospace" font-size="13" fill="#ffd9a0">
    <text x="196" y="120" text-anchor="middle" opacity="0">summarize
      <animate attributeName="y" values="140;92" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="230" y="120" text-anchor="middle" opacity="0">report
      <animate attributeName="y" values="146;88" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="170" y="120" text-anchor="middle" opacity="0">refund
      <animate attributeName="y" values="150;96" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- forged cache key chip -->
  <g transform="translate(470,96)">
    <rect x="0" y="0" width="210" height="60" rx="8" fill="#222a31" stroke="url(#copper)" stroke-width="2"/>
    <text x="16" y="26" font-family="monospace" font-size="13" fill="#e8a26a">key = sha1(canonical)</text>
