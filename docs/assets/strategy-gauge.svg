<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="CacheCraft strategy comparison chart">
  <title>Strategy trade-off gauge</title>
  <desc>Animated copper bars comparing hit rate across the four CacheCraft strategies on a slate panel.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b33"/>
      <stop offset="1" stop-color="#161c22"/>
    </linearGradient>
    <linearGradient id="barCopper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f4a24"/>
      <stop offset="1" stop-color="#e8a26a"/>
    </linearGradient>
