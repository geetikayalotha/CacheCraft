<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="CacheCraft strategy comparison chart">
  <title>Strategy trade-off gauge</title>
  <desc>Animated copper bars comparing hit rate across the four CacheCraft strategies on a slate panel.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b33"/>
      <stop offset="1" stop-color="#161c22"/>
    </linearGradient>
    <linearGradient id="barCopper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f4a24"/>
      <stop offset="1" stop-color="#e8a26a"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" rx="10" fill="url(#panel)"/>
  <text x="32" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8a26a">Hit rate by strategy</text>
  <text x="32" y="62" font-family="monospace" font-size="12" fill="#7f8f9d">support_trace.jsonl · warmed cache</text>

  <!-- axis -->
  <line x1="150" y1="90" x2="150" y2="280" stroke="#3a444f" stroke-width="2"/>
  <line x1="150" y1="280" x2="600" y2="280" stroke="#3a444f" stroke-width="2"/>
  <g font-family="monospace" font-size="10" fill="#5f6f7d">
    <text x="150" y="298">0%</text>
    <text x="370" y="298">50%</text>
    <text x="588" y="298">100%</text>
  </g>

  <!-- bars: width animates from 0 to value; max width 450 => 100% -->
  <g font-family="monospace" font-size="13" fill="#cdd8e0">
    <!-- exact 20% -->
    <text x="140" y="118" text-anchor="end">exact</text>
    <rect x="150" y="104" height="22" rx="3" fill="url(#barCopper)" width="0">
      <animate attributeName="width" values="0;90" dur="1.1s" fill="freeze"/>
    </rect>
    <text x="250" y="120" fill="#ffd9a0" opacity="0">20%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/></text>

    <!-- prefix 50% -->
    <text x="140" y="162" text-anchor="end">prefix</text>
    <rect x="150" y="148" height="22" rx="3" fill="url(#barCopper)" width="0">
      <animate attributeName="width" values="0;225" dur="1.1s" begin="0.15s" fill="freeze"/>
    </rect>
    <text x="385" y="164" fill="#ffd9a0" opacity="0">50%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.15s" fill="freeze"/></text>

    <!-- overlap 65% -->
    <text x="140" y="206" text-anchor="end">overlap</text>
    <rect x="150" y="192" height="22" rx="3" fill="url(#barCopper)" width="0">
      <animate attributeName="width" values="0;293" dur="1.1s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="453" y="208" fill="#ffd9a0" opacity="0">65%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/></text>

    <!-- route 65% -->
    <text x="140" y="250" text-anchor="end">route</text>
    <rect x="150" y="236" height="22" rx="3" fill="url(#barCopper)" width="0">
      <animate attributeName="width" values="0;293" dur="1.1s" begin="0.45s" fill="freeze"/>
    </rect>
    <text x="453" y="252" fill="#ffd9a0" opacity="0">65%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.45s" fill="freeze"/></text>
  </g>

  <!-- sweeping scan line (the "bench" measuring) -->
  <line x1="150" y1="90" x2="150" y2="280" stroke="#ffd9a0" stroke-width="2" opacity="0.6">
    <animate attributeName="x1" values="150;600;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="150;600;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.0;0.5;0.0" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
